name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (SHA verified against upstream)
        with:
          persist-credentials: false
      - run: python3 -I -W error -m unittest discover -s tests

  submission:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The checker comes from the base branch, so a pull request cannot change the code that judges it.
      - name: Checkout the base branch (the checker)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (SHA verified against upstream)
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Checkout the pull request (the data)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (SHA verified against upstream)
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Check what the pull request changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: python3 -I base/tools/check.py --root pr --changed "$BASE_SHA" --actor "$ACTOR"

  index:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (SHA verified against upstream)
        with:
          persist-credentials: false
      - run: python3 -I tools/check.py --all
      - name: Build the site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r machines _site/machines
          python3 -I tools/build_index.py -o _site/index.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1 (SHA verified against upstream)
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5 (SHA verified against upstream)
