<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; media-src https:; base-uri 'none'; form-action 'none'">
<title>Sidecar community machines</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Sidecar community machines</h1>
  <p class="notice"><strong>Community, not tested by Sidecar.</strong>
    A machine is native code with no sandbox: it can crash the engine. Prefer machines with source and
    never install a file sent to you in a direct message.
    <a href="https://github.com/trigcondition/sidecar-machines/blob/main/CONTRIBUTING.md">How to submit and the trust rules</a>.</p>
  <div class="controls">
    <input id="q" type="search" placeholder="Search name, id, author, description" aria-label="Search">
    <select id="board" aria-label="Board">
      <option value="">All boards</option>
      <option value="pi4">Pi 4</option>
      <option value="pi5">Pi 5</option>
      <option value="teensy">Teensy</option>
    </select>
    <label><input id="all" type="checkbox"> Show older versions</label>
  </div>
</header>
<main>
  <p id="status" role="status">Loading...</p>
  <ul id="list"></ul>
</main>
<script src="app.js"></script>
</body>
</html>
